[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-technical-analysis-engine"
version = "0.1.0"
description = "Deterministic, research-only OHLCV technical features and versioned artifacts"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tzdata>=2026.5 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "ruff==0.14.2",
    "build==1.3.0",
]

[project.scripts]
technical-engine = "technical_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
